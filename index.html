<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin | FvcktheRules</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf3fd">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="shell.css?v=1">
</head>
<body>
<div id="toast" class="toast"></div>

<!-- LOGIN (sekali di awal) -->
<div id="loginPage">
  <div class="login-box">
    <div class="login-logo">FVCKTHERULES</div>
    <div class="login-sub">admin panel</div>
    <div class="login-card">
      <div class="form-group"><label>Email</label>
        <input type="email" id="adminEmail" placeholder="admin@fcktherules" autocomplete="username"></div>
      <div class="form-group"><label>Password</label>
        <input type="password" id="adminPass" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn-primary" id="loginBtn">MASUK</button>
      <button class="btn-google" id="googleBtn"><i class="fab fa-google"></i> Masuk dengan Google</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>
</div>

<!-- SHELL -->
<div id="shell" hidden>
  <header class="topbar">
    <button class="burger" id="burger" aria-label="Buka menu" aria-expanded="false" aria-controls="drawer"><span></span><span></span><span></span></button>
    <div class="crumb"><span id="crumbCat">Web Utama</span><i class="fas fa-chevron-right"></i><b id="crumbTab">Order</b></div>
    <div class="warn" id="warn" hidden title=""><i class="fas fa-triangle-exclamation"></i></div>
  </header>

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Menu">
    <div class="drawer-head">
      <div><div class="logo">FVCKTHERULES</div><div class="logo-sub">ADMIN PANEL</div></div>
      <button class="x" id="drawerClose" aria-label="Tutup menu"><i class="fas fa-xmark"></i></button>
    </div>
    <nav id="nav"></nav>
    <div class="drawer-foot">
      <div class="who" id="who"></div>
      <button class="logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Keluar</button>
    </div>
  </aside>

  <main id="frames"></main>
</div>

<script type="module" src="shell.js?v=1"></script>
</body>
</html>
